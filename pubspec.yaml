name: zaatra_app
description: "Zaatra - Multi-role Transportation & Booking Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  razorpay_flutter: ^1.3.7
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

